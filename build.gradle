buildscript {
    repositories {
        jcenter()
        maven { url = "http://files.minecraftforge.net/maven" }
        maven { url = "https://repo.spongepowered.org/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'

//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.

version = getVersionFromJava()
group = mod_group
archivesBaseName = mod_id

configurations.configureEach {
    exclude group: "net.minecraftforge", module: "mergetool"
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

minecraft {
    mappings channel: mappings_channel, version: mappings_version
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    accessTransformer = file('src/main/resources/META-INF/mt_transformer.cfg')
	    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            
            jvmArg "-Dfml.coreMods.load=${mixin_loader_class}"
            jvmArg "-Dmixin.hotSwap=true"
            jvmArg "-Dmixin.checks.interfaces=true"
//            arg '-torg.spongepowered.asm.launch.MixinTweaker'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            jvmArg "-Dfml.coreMods.load=${mixin_loader_class}"
            jvmArg "-Dmixin.hotSwap=true"
            jvmArg "-Dmixin.checks.interfaces=true"
//            arg '-torg.spongepowered.asm.launch.MixinTweaker'
        }
    }
}

//Returns the current version by reading directly from the ModInfo.java file
def getVersionFromJava() {
	String versionPrefix = 'public static final String VERSION = "';

	String version = "V0";
	File file = file('src/main/java/com/existingeevee/moretcon/ModInfo.java')
	file.eachLine { String s ->
		s = s.trim();
		if (s.startsWith(versionPrefix)) {
			version = s.substring(versionPrefix.length(), s.length() - 2);
			System.out.println("Version: " + version)
		}
	}
	
	return version;
}

repositories {
    mavenCentral()
    maven { url = "https://repo.spongepowered.org/maven" }
    maven {
        name "CurseMaven"
        url "https://www.cursemaven.com"
    }
    maven {
        name "Baubles"
        url "http://maven.thiakil.com/"
    }
    maven {
        name "Covers1624"
        url "https://maven.covers1624.net/"
    }
    maven {
        name "ChickenBones"
        url "http://chickenbones.net/maven/"
    }
    maven {
        name "BlameJared Maven"
        url "https://maven.blamejared.com/"
    }
    flatDir {
        dir 'libs'
    }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    
    embed('org.spongepowered:mixin:0.8.3-SNAPSHOT') {
        exclude module: 'guava'
        exclude module: 'commons-io'
        exclude module: 'gson'
    }
    
    embed('io.github.llamalad7:mixinextras-common:0.5.0-rc.1')
    
    implementation  'curse.maven:mantle-74924:2713386'
    //implementation  'curse.maven:tinkers-construct-74072:2902483'
    implementation  'curse.maven:tinkers-antique-1242239:8089154'
 	//implementation  'elite_modding_team:TinkersAntique:1.12.2-2.13.0.203' 
    implementation  'com.azanor.baubles:Baubles:1.12-1.5.2'
    implementation  'curse.maven:plusticminusbad-376903:3648592'

    implementation  'curse.maven:aether-255308:3280119'
    implementation  'curse.maven:angry-pixel-the-betweenlands-mod-243363:4479688'
    implementation  'curse.maven:the-twilight-forest-227639:3051450'

    implementation  'curse.maven:libnine-322344:3509087'
    implementation  'curse.maven:tinkers-evolution-384589:3362723'
    implementation  'curse.maven:constructs-armory-287683:3174535'
    implementation  'curse.maven:tinkers-tool-leveling-250957:2630860'

    implementation  'curse.maven:jei-238222:4538010'

    implementation "CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.715"
    implementation "com.teamacronymcoders.base:base:1.12.2-3.11.0-SNAPSHOT.+"
    implementation "curse.maven:contenttweaker-237065:3331364"

    implementation  'codechicken:CodeChickenLib:1.12.2-3.2.3_devfix.1-universal'
	implementation  'curse.maven:fermiumbooter-968474:6848648'

	implementation ("net.minecraftforge:mergetool:0.2.3.3") { force = true }
	
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.0-rc.1"	
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", minecraft_version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':minecraft_version
    }

    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

import java.security.MessageDigest

def sha1 = { File file ->
	def digest = MessageDigest.getInstance("SHA-1")

	file.withInputStream { input ->
		byte[] buffer = new byte[8192]
		int read

		while ((read = input.read(buffer)) != -1) {
			digest.update(buffer, 0, read)
		}
	}

	digest.digest().collect { String.format("%02x", it) }.join()
}

// we need the core jar from the betweenlands. 
// we simply extract it out
task extractBetweenlandsCore {
	doLast {
		def dependency = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
			it.moduleVersion.id.group == "curse.maven" &&
			it.name == "angry-pixel-the-betweenlands-mod-243363"
		}

		if (dependency == null) {
			throw new GradleException("Unable to find betweenlands artifact.")
		}

		def sourceJar = dependency.file
		def modsDir = file("$projectDir/run/mods")
		modsDir.mkdirs()

		def coreEntry = zipTree(sourceJar).matching {
			include "**/TheBetweenlands-*-core.jar"
		}.files.find()

		if (coreEntry == null) {
			throw new GradleException("TheBetweenlands-*-core.jar does not exist in the betweenlands artifact: ${sourceJar.name}")
		}

		def target = new File(modsDir, coreEntry.name)

		modsDir.listFiles()?.findAll {
			it.name.startsWith("TheBetweenlands-") && it.name.endsWith("-core.jar") && it != target
		}?.each {
			println "Deleting outdated Betweenlands core: ${it.name}"
			it.delete()
		}

		if (!target.exists() || sha1(target) != sha1(coreEntry)) {
			if (target.exists()) {
				println "Replacing outdated Betweenlands core: ${target.name}"
				target.delete()
			} else {
				println "Extracting Betweenlands core: ${target.name}"
			}

			copy {
				from coreEntry
				into modsDir
			}
		}
	}
}

//yep we need those
tasks.matching { 
	it.name == "runClient" || 	
	it.name == "runServer" || 	
	it.name == "genEclipseRuns" || 	
	it.name == "genIntellijRuns" || 	
	it.name == "genVSCodeRuns" 
}.all {	
	dependsOn extractBetweenlandsCore
}

mixin {
    add sourceSets.main, "refmap.${mod_id}.json"
    //config mod_mixin_configs.replace('${mod_id}', mod_id)
}

jar {
    from(configurations.embed.collect {
        it.isDirectory() ? it : zipTree(it)
    }) {
        exclude "LICENSE.txt", "META-INF/MANIFSET.MF", "META-INF/maven/**", "META-INF/*.RSA", "META-INF/*.SF"
    }

    manifest.attributes(
            'ForceLoadAsMod': 'true',
            'FMLCorePluginContainsFMLMod': 'true',
            "FMLCorePlugin": mixin_loader_class,
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'TweakOrder': '0',
            'FMLAT': 'mt_transformer.cfg'
    )
} 

jar.finalizedBy('reobfJar')
